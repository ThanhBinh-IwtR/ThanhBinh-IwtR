name: Profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check activity calculations
        run: python -m unittest discover -s tests -v
      - name: Draw the contribution snake from the real calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#2b776a&color_dots=#ebedf0,#d8ccf6,#b3a1e6,#8b74d0,#6e58ab
            assets/snake-dark.svg?color_snake=#a9dfcf&color_dots=#161b22,#3b3360,#5b4e91,#8f7cc9,#c4b5fd
      - name: Write public activity into README
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_activity.py
      - name: Commit changed activity
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.svg assets/fields.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet
          then
            echo 'Profile activity is already current.'
            exit 0
          fi
          git commit -m 'chore: refresh public profile activity'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
