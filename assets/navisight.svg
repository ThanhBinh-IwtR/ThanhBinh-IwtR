<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180" role="img" aria-labelledby="title">
<title id="title">A floor in perspective shaded by estimated depth, with a chair detected at 0.9 metres, a person at 2.4 metres, and a sound wave for the spoken guidance.</title>
<style>
  svg { --violet: #8b74d0; --mint: #3f9c8a; --mint-deep: #2f7d6e; --sky: #4c8dc4; --sky-deep: #3b78ad; --slate: #768390; }
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .floor { fill: none; stroke: url(#depth); }
  .horizon { stroke: var(--slate); stroke-opacity: .35; }
  .frame { fill-opacity: .07; stroke-width: 1.5; }
  .corners { fill: none; stroke-width: 3; stroke-linecap: square; }
  .near .frame, .near .corners { stroke: var(--mint); } .near .frame { fill: var(--mint); }
  .far .frame, .far .corners { stroke: var(--sky); } .far .frame { fill: var(--sky); }
  .tag text { fill: #fff; } .tag.near rect { fill: var(--mint-deep); } .tag.far rect { fill: var(--sky-deep); }
  .object { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .chair { stroke: var(--mint); } .person { stroke: var(--sky); }
  .wave { stroke: var(--violet); stroke-width: 3; stroke-linecap: round; }
</style>
<defs><linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="180">
