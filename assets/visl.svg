<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180" role="img" aria-labelledby="title">
<title id="title">Three frames of a hand traced as 21 landmarks each, turned into a sequence of tokens and recognised as the Vietnamese sign for xin chào.</title>
