  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .bone { fill: none; stroke: var(--violet); stroke-width: 2; stroke-linecap: round; }
  .joint { fill: var(--mint); }
  .frame-label { fill: var(--slate); text-anchor: middle; font-size: 10px; }
  .tokens rect { fill: var(--violet); }
  .arrow { fill: none; stroke: var(--slate); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .word rect { fill: var(--mint-deep); } .word text { fill: #fff; text-anchor: middle; }
</style>
