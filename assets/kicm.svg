<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" role="img" aria-labelledby="title">
<title id="title">An enzyme binds its substrate in the active site and releases the product, beside a Michaelis-Menten curve where the reaction rate rises toward Vmax. kcat is Vmax divided by the enzyme concentration.</title>
<style>
  svg { --violet: #8b74d0; --mint: #3f9c8a; --sky: #4c8dc4; --rose: #c0628a; --slate: #768390; }
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: var(--slate); font-size: 13px; }
  .enzyme { fill: var(--violet); fill-opacity: .12; stroke: var(--violet); stroke-width: 1.8; }
  .helix { fill: none; stroke: var(--mint); stroke-width: 2.5; stroke-linecap: round; opacity: .75; }
  .strand { fill: var(--sky); opacity: .45; }
  .site { fill: var(--rose); }
  .spark { fill: none; stroke: var(--rose); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .molecule { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .substrate .molecule { stroke: var(--sky); }
  .product { opacity: 0; }
  .product .molecule { stroke: var(--mint); }
  .oxygen { fill: var(--rose); }
  .axis { fill: none; stroke: var(--slate); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .guide { fill: none; stroke: var(--slate); stroke-opacity: .6; stroke-dasharray: 4 4; }
  .curve { fill: none; stroke: var(--violet); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 351; }
  .measured { fill: none; stroke: var(--sky); stroke-width: 1.5; }
  .tracer { fill: var(--mint); transform: translate(846px, 80.2px); }
  .note { fill: var(--violet); font-size: 12px; }
  .small { font-size: 11px; }

  /* A 6 s loop: the substrate docks, the active site fires, the product leaves; the curve draws alongside. */
  .substrate { animation: bind 6s ease-in-out infinite; }
  .site { animation: fire 6s infinite; }
  .spark { animation: spark 6s ease-out infinite; }
  .product { animation: release 6s ease-in infinite; }
  .curve { animation: draw 6s infinite; }
  .tracer { animation: trace 6s linear infinite; }
  @keyframes bind { 0% { transform: translate(150px, -76px); opacity: 0; } 8% { opacity: 1; }
    30%, 52% { transform: none; opacity: 1; } 56%, 100% { transform: none; opacity: 0; } }
  @keyframes fire { 0%, 32%, 56%, 100% { opacity: .55; } 38%, 50% { opacity: 1; } }
  @keyframes spark { 0%, 32% { opacity: 0; transform: scale(.6); } 40% { opacity: .9; transform: scale(1); }
    52%, 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes release { 0%, 52% { opacity: 0; transform: none; } 56% { opacity: 1; transform: none; }
    86% { opacity: 1; transform: translate(150px, 70px); } 94%, 100% { opacity: 0; transform: translate(170px, 78px); } }
  @keyframes draw { 0% { stroke-dashoffset: 351; opacity: 1; } 45%, 86% { stroke-dashoffset: 0; opacity: 1; }
    96% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 351; opacity: 0; } }
  @keyframes trace {
    0.00% { transform: translate(540px, 196px); }
    3.75% { transform: translate(551.1px, 169px); }
    7.50% { transform: translate(567.3px, 144.7px); }
    11.25% { transform: translate(589.2px, 125.5px); }
    15.00% { transform: translate(615.1px, 112px); }
    18.75% { transform: translate(642.8px, 102.8px); }
    22.50% { transform: translate(671.4px, 96.5px); }
    26.25% { transform: translate(700.3px, 91.8px); }
    30.00% { transform: translate(729.3px, 88.4px); }
    33.75% { transform: translate(758.4px, 85.6px); }
    37.50% { transform: translate(787.6px, 83.5px); }
    41.25% { transform: translate(816.8px, 81.7px); }
    45.00% { transform: translate(846px, 80.2px); }
    86% { transform: translate(846px, 80.2px); opacity: 1; }
    96%, 100% { transform: translate(846px, 80.2px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .substrate, .site, .spark, .product, .curve, .tracer { animation: none; } }
</style>

