<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 208" width="880" height="208" role="img" aria-labelledby="title">
<title id="title">Three aligned protein sequences named perception, reasoning and discovery. A detection box slides across the columns and locks onto the conserved motif T A B I, labelled tabi 0.98.</title>
<style>
  /* Mid-tone colours read on both GitHub themes, so one file serves light and dark. */
  svg { --violet: #8b74d0; --mint: #3f9c8a; --mint-deep: #2f7d6e; --sky: #4c8dc4; --rose: #c0628a; --sand: #b08a3e; --slate: #768390; }
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .ruler, .name { fill: var(--slate); font-size: 11px; }
  .name { font-size: 12px; text-anchor: end; }
  .tick { stroke: var(--slate); stroke-opacity: .6; }
  .seq { font-size: 13px; font-weight: 600; text-anchor: middle; }
  .gap { fill: var(--slate); fill-opacity: .7; }
  .hyd { fill: var(--violet); } .pol { fill: var(--mint); } .bas { fill: var(--sky); }
  .aci { fill: var(--rose); } .spe { fill: var(--sand); }
  .cells path { fill-opacity: .16; }
  .conservation { fill: var(--mint); fill-opacity: .38; }
  .hit .cell, .hit .bar { fill: var(--violet); }
  .hit text { fill: #fff; }
  .frame { fill: var(--mint); fill-opacity: .06; stroke: var(--mint); stroke-width: 1.5; }
  .corners { fill: none; stroke: var(--mint); stroke-width: 3; stroke-linecap: square; }
  .tag rect { fill: var(--mint-deep); }
  .tag text { fill: #fff; font-size: 11px; }

  /* An 8 s loop: pause, slide one residue at a time, lock on and hold, then fade and start over. */
  .box { animation: scan 8s infinite; }
  .corners, .tag, .hit { animation: lock 8s infinite; }
  @keyframes scan {
    0%, 6% { transform: translateX(-420px); opacity: 1; animation-timing-function: steps(30, jump-end); }
    40%, 86% { transform: translateX(0); opacity: 1; animation-timing-function: ease-in; }
    92% { transform: translateX(0); opacity: 0; animation-timing-function: step-end; }
    94% { transform: translateX(-420px); opacity: 0; animation-timing-function: ease-out; }
    100% { transform: translateX(-420px); opacity: 1; }
  }
  @keyframes lock { 0%, 41% { opacity: 0; } 45%, 84% { opacity: 1; } 89%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .box, .corners, .tag, .hit { animation: none; } }
</style>
